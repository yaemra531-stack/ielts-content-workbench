<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>雅思 AI 图文工作台 · 16 步</title><link rel="stylesheet" href="app.css"></head>
<body><div id="workbench"><header><div><span class="eyebrow">雅思 × AI</span><h1>把这一篇做完</h1></div><span class="muted">16 个独立板块 · 可并行推进</span></header><div class="workspace"><aside><section id="library-tools"><label for="note-picker">我的笔记</label><select id="note-picker" aria-label="切换笔记"></select><label class="check"><input type="checkbox" id="reuse-profile" checked><span>新篇沿用当前账号定位、原则、人格（01—03）</span></label><button id="new-note" type="button">＋ 新建笔记</button><details id="quick-capture"><summary>随手记一句</summary><label for="quick-scene">刚才具体卡在哪里？</label><textarea id="quick-scene" rows="3" maxlength="20000" placeholder="例如：这个单词看得懂，但录音里总听不出来。"></textarea><div class="actions"><button id="save-quick" type="button">保存为草稿</button><button id="cancel-quick" type="button">取消</button></div><p id="quick-status" class="muted" role="status"></p></details><div class="actions"><button id="backup-all" type="button">备份全部笔记</button><button id="restore-backup" type="button">恢复备份</button></div><input type="file" id="backup-file" accept=".json,application/json" hidden><p class="muted">备份包含文字、进度和参考图；恢复时添加副本，不覆盖现有笔记。</p><p id="library-status" role="status" class="muted"></p></section><p id="save-state" role="status" class="muted"></p><label for="post-name">当前笔记</label><input id="post-name" maxlength="100" placeholder="给这篇笔记起个名字"><div class="resume-box"><p id="resume-location" class="muted"></p><label for="resume-note">下次从这里继续（选填）</label><textarea id="resume-note" rows="2" maxlength="300" placeholder="例如：标题明天从第二个候选改"></textarea><button id="resume-jump" type="button" hidden>回到提醒对应的板块 →</button></div><div class="progress-head" id="count"></div><progress id="progress" max="16" value="0" aria-label="制作进度"></progress><details id="navigation" open><summary>制作步骤</summary><nav id="steps" aria-label="制作步骤"></nav></details><details id="legacy" hidden><summary>六步版旧记录（原样保留）</summary><pre id="legacy-text"></pre></details></aside><main><div class="eyebrow" id="stage-number"></div><h2 id="stage-title"></h2><p id="action" class="muted"></p><p id="parallel-state" class="muted"></p><p id="review-notice" class="linked" role="status" hidden></p><div class="step-minimum"><p id="step-blocker"></p><p id="step-minimum"></p><small>可以先留草稿、随时切换；确认完成时仍按原要求检查。</small></div><div id="fields"></div><details id="guidance"><summary>卡住时，看一个提示</summary><p id="hint"></p></details><div id="notice" role="status"></div><div class="actions"><button id="primary" class="primary" type="button">请AI帮我处理这一步</button><button id="complete" type="button">确认这一步已完成</button></div><p id="next-specific" class="next-specific"></p><details id="handoff" hidden><summary>交给 Codex 的任务</summary><textarea id="handoff-text" rows="10" readonly aria-label="交接任务"></textarea><div class="actions"><button id="copy-handoff" type="button">复制任务</button><button id="download-handoff" type="button">下载任务 Markdown</button></div><p class="muted">网页会带上已有内容。复制到当前 Codex 对话执行，完成后将结果填回对应板块。</p></details></main></div><footer>文字和勾选保存在当前浏览器，参考图保存在本机浏览器素材库。更换浏览器不会自动同步。第 16 步可导出全部文字记录。</footer></div><script src="app.js"></script></body></html>
